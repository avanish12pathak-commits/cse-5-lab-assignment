<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <label for="firstname">Name:</label>
        <input type="text" id="firstname" name="firstname" placeholder="First Name" required><br><br>    

        <label for="lastname">Surname:</label>
        <input type="text" id="lastname" name="lastname" placeholder="Last Name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Email" required><br><br>
         
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="Phone Number" required><br><br>

        <label for="Date of birth">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="stream">Stream:</label>
        <select id="stream" name="stream" required>
            <option value="" disabled selected>Select Stream</option>
            <option value="Arts">Arts</option>
            <option value="Commerce">Commerce</option>
            <option value="Science">Science</option>
        </select><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label><br><br>
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Other</label><br><br>

        <label for="general">General:</label>
        <input type="checkbox" id="general" name="general" value="general"><br><br>
        <label for="obc">OBC:</label>
        <input type="checkbox" id="obc" name="obc" value="obc"><br><br>
        <label for="sc">SC:</label>
        <input type="checkbox" id="sc" name="sc" value="sc"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Password" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" placeholder="Enter your message here..." required></textarea><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
